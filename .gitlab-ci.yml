stages:
  - build
  - upload
  - release

variables:
  APP_NAME: "CodexUsage"
  PACKAGE_NAME: "codex-usage"

build_macos:
  stage: build
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - bun install --frozen-lockfile
    - VERSION="${CI_COMMIT_TAG#v}" BUILD_NUMBER="${CI_PIPELINE_IID}" bun run package:app
    - ditto -c -k --keepParent --norsrc --noextattr "dist/${APP_NAME}.app" "dist/${APP_NAME}-${CI_COMMIT_TAG}.zip"
  artifacts:
    paths:
      - "dist/${APP_NAME}-${CI_COMMIT_TAG}.zip"
    expire_in: 1 week

upload_package:
  stage: upload
  image: curlimages/curl:latest
  needs:
    - job: build_macos
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}"
    - |
      curl --fail \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${APP_NAME}-${CI_COMMIT_TAG}.zip" \
        "${PACKAGE_URL}/${APP_NAME}-${CI_COMMIT_TAG}.zip"

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - upload_package
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - export GITLAB_HOST="${CI_SERVER_HOST}"
    - export GITLAB_TOKEN="${CI_JOB_TOKEN}"
    - PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}"
    - ASSET_URL="${PACKAGE_URL}/${APP_NAME}-${CI_COMMIT_TAG}.zip"
    - |
      glab release create "${CI_COMMIT_TAG}" \
        --repo "${CI_PROJECT_PATH}" \
        --name "${APP_NAME} ${CI_COMMIT_TAG}" \
        --notes "Release ${CI_COMMIT_TAG}" \
        --assets-links "[{\"name\":\"${APP_NAME}-${CI_COMMIT_TAG}.zip\",\"url\":\"${ASSET_URL}\",\"link_type\":\"package\",\"direct_asset_path\":\"/downloads/${APP_NAME}-${CI_COMMIT_TAG}.zip\"}]"
