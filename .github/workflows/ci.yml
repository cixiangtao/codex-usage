name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and package
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check release tooling
        run: bun run typecheck

      - name: Run Swift tests
        run: swift test

      - name: Package ad-hoc signed app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(bun -p 'require("./package.json").version')"
          VERSION="$VERSION" OUTPUT_DIR=dist bun run package:app

      - name: Verify app signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/CodexUsage.app
          codesign -dv --verbose=4 dist/CodexUsage.app 2>&1 | grep -q "Signature=adhoc"
          cmp LICENSE dist/CodexUsage.app/Contents/Resources/LICENSE
          cmp THIRD_PARTY_NOTICES.md \
            dist/CodexUsage.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          bun run verify:app-launch -- dist/CodexUsage.app
