name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Verify merged release PR
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release admission
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"

          pull_requests="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls")"
          release_pr="$(jq -c '
            [
              .[]
              | select(.merged_at != null)
              | select(.merge_commit_sha == env.RELEASE_SHA)
              | select(.base.ref == "master")
              | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
              | select(.head.ref | startswith("release-please--branches--master--"))
              | select([.labels[].name] | any(. == "autorelease: pending" or . == "autorelease: tagged"))
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$pull_requests")"

          if [[ -z "$release_pr" ]]; then
            echo "This commit is not the merge of one automated release PR; publication is skipped."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<< "$release_pr")"
          base_sha="$(git rev-parse "${RELEASE_SHA}^")"
          version="$(bun -p 'require("./package.json").version')"
          tag="v${version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release version: ${version}" >&2
            exit 1
          fi

          changed_files="$(gh api \
            -H "Accept: application/vnd.github+json" \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            --jq '.[].filename')"
          while IFS= read -r file; do
            case "$file" in
              .release-please-manifest.json|CHANGELOG.md|package.json) ;;
              *)
                echo "Release PR #${pr_number} contains non-release file: ${file}" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          git show "${base_sha}:package.json" > "$RUNNER_TEMP/package.base.json"
          jq -S 'del(.version)' "$RUNNER_TEMP/package.base.json" \
            > "$RUNNER_TEMP/package.base.normalized.json"
          jq -S 'del(.version)' package.json \
            > "$RUNNER_TEMP/package.release.normalized.json"
          cmp \
            "$RUNNER_TEMP/package.base.normalized.json" \
            "$RUNNER_TEMP/package.release.normalized.json"
          test "$(jq -r '.["."]' .release-please-manifest.json)" = "$version"
          grep -F "$version" CHANGELOG.md >/dev/null

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag ${tag} already points to ${tag_sha}, not ${RELEASE_SHA}." >&2
              exit 1
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify artifacts
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-15
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check release tooling
        run: bun run typecheck

      - name: Run Swift tests
        run: swift test

      - name: Package ad-hoc signed app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          OUTPUT_DIR=dist bun run package:app
          ditto -c -k --keepParent --norsrc --noextattr \
            dist/CodexUsage.app "dist/CodexUsage-v${VERSION}.zip"

          dmg_root="$RUNNER_TEMP/dmg-root"
          mkdir -p "$dmg_root"
          ditto dist/CodexUsage.app "$dmg_root/CodexUsage.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname CodexUsage \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "dist/CodexUsage-v${VERSION}.dmg"

          (
            cd dist
            shasum -a 256 \
              "CodexUsage-v${VERSION}.dmg" \
              "CodexUsage-v${VERSION}.zip" \
              > SHA256SUMS.txt
          )

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          codesign --verify --deep --strict --verbose=2 dist/CodexUsage.app
          codesign -dv --verbose=4 dist/CodexUsage.app 2>&1 | grep -q "Signature=adhoc"
          cmp LICENSE dist/CodexUsage.app/Contents/Resources/LICENSE
          cmp THIRD_PARTY_NOTICES.md \
            dist/CodexUsage.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          bun run verify:app-launch -- dist/CodexUsage.app
          unzip -t "dist/CodexUsage-v${VERSION}.zip"
          hdiutil verify "dist/CodexUsage-v${VERSION}.dmg"

          mount_point="$RUNNER_TEMP/codex-usage-dmg"
          mkdir -p "$mount_point"
          hdiutil attach \
            "dist/CodexUsage-v${VERSION}.dmg" \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/CodexUsage.app"
          test -L "$mount_point/Applications"
          app_version="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$mount_point/CodexUsage.app/Contents/Info.plist")"
          test "$app_version" = "$VERSION"
          bun run verify:app-launch -- "$mount_point/CodexUsage.app"
          hdiutil detach "$mount_point"
          trap - EXIT

          (
            cd dist
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-usage-${{ needs.gate.outputs.version }}
          path: |
            dist/CodexUsage-v${{ needs.gate.outputs.version }}.dmg
            dist/CodexUsage-v${{ needs.gate.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Tag and publish GitHub Release
    needs:
      - gate
      - build
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-usage-${{ needs.gate.outputs.version }}
          path: published

      - name: Verify downloaded artifacts
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          (
            cd published
            shasum -a 256 -c SHA256SUMS.txt
            unzip -t "CodexUsage-v${VERSION}.zip"
            hdiutil verify "CodexUsage-v${VERSION}.dmg"
          )

      - name: Create release tag
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## 安装

            下载 DMG 后，将 `CodexUsage.app` 拖入“应用程序”文件夹。ZIP 是 DMG 无法使用时的备用包。

            当前构建使用 ad-hoc 签名，尚未使用 Developer ID 签名或 Apple 公证。请在安装前核对
            `SHA256SUMS.txt`；如果 macOS 阻止打开，请在“系统设置 → 隐私与安全性”中确认来源后放行。
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" published/* --clobber
          else
            gh release create "$TAG" published/* \
              --verify-tag \
              --generate-notes \
              --notes "$RELEASE_NOTES" \
              --title "CodexUsage ${TAG}"
          fi

      - name: Verify published Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,url

  release-pr:
    name: Maintain automated release PR
    needs: [gate, publish]
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      (needs.gate.outputs.release != 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify release controller credentials
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$CLIENT_ID" || { echo "RELEASE_APP_CLIENT_ID is not configured." >&2; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "RELEASE_APP_PRIVATE_KEY is not configured." >&2; exit 1; }
      - name: Create short-lived release controller token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Create or update release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
